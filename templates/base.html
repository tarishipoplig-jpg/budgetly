<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Budget Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20260907') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand-link" href="{{ url_for('landing') }}">
        <img class="logo-image" src="{{ url_for('static', filename='images/logo.png') }}" alt="Budgetly logo">
        <h1 class="brand">Budgetly</h1>
      </a>
      {% if session.get('user_id') %}
      <a class="btn header-action" href="{{ url_for('logout') }}">Sign out</a>
      {% elif request.endpoint == 'landing' %}
      <a class="btn header-action" href="{{ url_for('capture_email') }}">Log in</a>
      {% endif %}
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <img class="logo-image small-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Budgetly logo">
      <span>&copy; {{ current_year if current_year else "" }}</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
